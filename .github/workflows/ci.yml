name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: swift test
      - name: Build app bundle (host arch, ad-hoc signed)
        run: UNIVERSAL=0 ./scripts/bundle.sh
